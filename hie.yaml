cradle:
  cabal:
    - path: "hewts/src"
      component: "lib:hewts"

    - path: "hewts/test"
      component: "hewts:test:hewts-test"

    - path: "hewts/benchmark/Main.hs"
      component: "hewts:bench:hewts-benchmark"

    - path: "hibet/src"
      component: "lib:hibet"

    - path: "hibet/test/labels"
      component: "hibet:test:hibet-labels"

    - path: "hibet/test/env"
      component: "hibet:test:hibet-env"

    - path: "hibet/benchmark/Main.hs"
      component: "hibet:bench:hibet-benchmark"

    - path: "hibet/benchmark/Common.hs"
      component: "hibet:bench:hibet-benchmark"

    - path: "hibet/benchmark/Lines.hs"
      component: "hibet:bench:hibet-benchmark"

    - path: "hibet-cli/src"
      component: "lib:hibet-cli"

    - path: "hibet-cli/app/Main.hs"
      component: "hibet-cli:exe:hibet"

    - path: "hibet-cli/test/pretty"
      component: "hibet-cli:test:hibet-pretty"

    - path: "hibet-tools/src"
      component: "lib:hibet-tools"

    - path: "hibet-tools/app/Main.hs"
      component: "hibet-tools:exe:hibet-update-dicts"

    - path: "hibet-tools/test"
      component: "hibet-tools:test:hibet-tools-test"
