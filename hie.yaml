cradle:
  cabal:
    - path: "hewts/src"
      component: "lib:hewts"

    - path: "hewts/app/Main.hs"
      component: "hewts:exe:hewts"

    - path: "hewts/test"
      component: "hewts:test:hewts-test"

    - path: "hewts/benchmark/Main.hs"
      component: "hewts:bench:hewts-benchmark"

    - path: "hibet/src"
      component: "lib:hibet"

    - path: "hibet/app/Main.hs"
      component: "hibet:exe:hibet"

    - path: "hibet/test/pretty"
      component: "hibet:test:hibet-pretty"

    - path: "hibet/test/labels"
      component: "hibet:test:hibet-labels"

    - path: "hibet/test/env"
      component: "hibet:test:hibet-env"

    - path: "hibet/test/parse"
      component: "hibet:test:hibet-parse"

    - path: "hibet/benchmark/Main.hs"
      component: "hibet:bench:hibet-benchmark"

    - path: "hibet/benchmark/Common.hs"
      component: "hibet:bench:hibet-benchmark"

    - path: "hibet/benchmark/Lines.hs"
      component: "hibet:bench:hibet-benchmark"
